<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Products – SASS BOTTLE Admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/admin-dashboard.css"/>
  <link rel="stylesheet" href="css/admin-products.css"/>
</head>
<body>

  <!-- =============================================
       ADMIN TOP BAR — same as dashboard, with tabs
  ============================================= -->
  <nav class="admin-nav">
    <div class="admin-nav-left">
      <img src="assets/logo.svg" alt="SASS BOTTLE" class="admin-logo"/>
      <span class="admin-title">Admin Dashboard</span>
    </div>
    <div class="admin-nav-right">
      <span class="admin-username" id="adminUsernameDisplay"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <!-- Tab navigation between Orders and Products -->
  <div class="admin-tabs">
    <a href="admin-dashboard.html" class="admin-tab">Orders</a>
    <a href="admin-products.html" class="admin-tab active">Products</a>
    <a href="admin-reports.html" class="admin-tab">Reports</a>
  </div>

  <!-- Ambient animated bokeh background -->
  <div class="admin-bokeh bokeh-bg" aria-hidden="true">
    <div class="bokeh-orb"></div>
    <div class="bokeh-orb"></div>
    <div class="bokeh-orb"></div>
    <div class="bokeh-orb"></div>
  </div>

  <main class="admin-page">

    <div class="admin-eyebrow"><span>Store Management</span></div>

    <!-- =============================================
         PRODUCTS SECTION
    ============================================= -->
    <div class="orders-section">

      <div class="orders-header">
        <h2>Products</h2>

        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">

          <!-- Search box — filters by product name as you type -->
          <div class="admin-search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
            </svg>
            <input type="text" id="productSearch" placeholder="Search products…"/>
          </div>

          <!-- Sort dropdown -->
          <select id="productSortSelect" class="admin-sort-select">
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
          </select>

          <!-- Category filter chips — loaded dynamically -->
          <div class="status-filters" id="categoryFilters">
            <button class="status-chip active" data-category="">All</button>
          </div>

          <!-- Add new product button -->
          <button class="btn-primary" id="addProductBtn" style="padding:10px 22px; font-size:0.78rem;">
            + Add Product
          </button>
        </div>
      </div>

      <!-- Products table -->
      <div class="orders-table-wrap">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Availability</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="5" class="loading-row">Loading products…</td></tr>
          </tbody>
        </table>
      </div>

    </div>

  </main>

  <!-- =============================================
       PRODUCT FORM MODAL
       Used for both "Add Product" and "Edit Product"
  ============================================= -->
  <div class="modal-overlay" id="productModal" style="display:none;">
    <div class="modal-box">
      <button class="modal-close" id="productModalCloseBtn">×</button>

      <h3 id="productModalTitle">Add Product</h3>

      <form id="productForm" class="product-form">

        <div class="form-group">
          <label for="prodName">Product Name *</label>
          <input type="text" id="prodName" placeholder="e.g. Gilbey's (Big)" required/>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodCategory">Category *</label>
            <select id="prodCategory" required>
              <!-- Options loaded dynamically -->
            </select>
          </div>
          <div class="form-group">
            <label for="prodPrice">Price (UGX) *</label>
            <input type="number" id="prodPrice" placeholder="e.g. 35000" required min="0"/>
          </div>
        </div>

        <div class="form-group">
          <label for="prodVolume">Volume (ml, optional)</label>
          <input type="number" id="prodVolume" placeholder="e.g. 750"/>
        </div>

        <!-- Product photo upload -->
        <div class="form-group">
          <label for="prodImage">Product Photo (optional)</label>
          <input type="file" id="prodImage" accept="image/*"/>

          <!-- Preview of the selected or existing photo -->
          <div class="image-preview-wrap" id="imagePreviewWrap" style="display:none;">
            <img id="imagePreview" src="" alt="Product preview"/>
          </div>
        </div>

        <!-- Availability toggle -->
        <div class="form-group">
          <label>Availability</label>
          <div class="toggle-wrap">
            <label class="toggle-switch">
              <input type="checkbox" id="prodInStock" checked/>
              <span class="toggle-slider"></span>
            </label>
            <span id="prodInStockLabel">In Stock</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="productSaveBtn" style="width:100%; text-align:center;">
          Save Product
        </button>

        <div class="form-error" id="productFormError" style="display:none;"></div>

      </form>

      <!-- Delete button — only shown when editing an existing product -->
      <button class="btn-delete-product" id="deleteProductBtn" style="display:none;">
        Delete this product
      </button>

    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="js/global.js"></script>
  <script src="js/admin-products.js"></script>

</body>
</html>
