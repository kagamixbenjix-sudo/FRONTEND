<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – SASS BOTTLE</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/admin-login.css"/>
</head>
<body>

  <!-- =============================================
       ADMIN LOGIN PAGE
       Simple centered card — no public nav here,
       this page is only for store administrators
  ============================================= -->
  <main class="admin-login-page">

    <div class="bokeh-bg" aria-hidden="true">
      <div class="bokeh-orb"></div>
      <div class="bokeh-orb"></div>
      <div class="bokeh-orb"></div>
    </div>

    <div class="login-card">

      <!-- Logo -->
      <img src="assets/logo.svg" alt="SASS BOTTLE" class="login-logo"/>

      <h1>Admin <em>Login</em></h1>
      <p class="login-subtitle">Sign in to manage orders and view sales</p>

      <form id="adminLoginForm" class="login-form">

        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" placeholder="Enter username" required autocomplete="username"/>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password" required autocomplete="current-password"/>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%; text-align:center;">
          Sign In
        </button>

        <!-- Error message shown on failed login -->
        <div class="login-error" id="loginError" style="display:none;"></div>

      </form>

      <!-- Link back to the public site -->
      <a href="index.html" class="back-to-site">← Back to SASS BOTTLE</a>

    </div>
  </main>

  <script src="js/global.js"></script>
  <script src="js/admin-login.js"></script>

</body>
</html>
